name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inflacion_lab_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inflacion_lab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inflacion_lab_test
      DATABASE_URL_MIGRATIONS: postgresql+psycopg://postgres:postgres@localhost:5432/inflacion_lab_test
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Preparar uv y Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.18"
          python-version: "3.12"
          enable-cache: true
      - name: Instalar dependencias bloqueadas
        run: uv sync --locked
      - name: Instalar frontend bloqueado
        run: make setup-web
      - name: Verificar calidad
        run: make check
      - name: Ejecutar pruebas unitarias
        run: make test
      - name: Ejecutar pruebas de integración
        run: make test-db
      - name: Ejecutar pruebas web
        run: make test-web
      - name: Compilar web
        run: make build-web
