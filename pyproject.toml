[project]
name = "mexico-inflacion-lab"
version = "0.1.0"
description = "Laboratorio interactivo para explorar la inflación en México con datos del INEGI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "pyyaml>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.1,<2.2",
]

[project.scripts]
inflacion-lab = "inflacion_lab.cli:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflacion_lab"]

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "pytest>=8.3,<9",
    "ruff>=0.14,<0.18",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: prueba que requiere una base de datos u otro servicio externo",
]
