[project]
name = "mexico-inflacion-lab"
version = "0.1.0"
description = "Laboratorio interactivo para explorar la inflación en México con datos del INEGI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.3,<5",
    "ruff>=0.14,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
